databases:
  - name: tactical-map-db
    plan: basic-256mb

services:
  - type: web
    name: tactical-map
    runtime: ruby
    plan: starter
    buildCommand: ./bin/render-build.sh
    preDeployCommand: bundle exec rails db:prepare && bundle exec rails db:seed
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: tactical-map-db, property: connectionString }
      - key: SOLID_QUEUE_IN_PUMA
        value: '1'
      - key: RAILS_MASTER_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: '1'
